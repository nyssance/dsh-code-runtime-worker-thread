name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Upstream version (default: UPSTREAM_VERSION)"
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun test
      - name: Build
        env:
          UPSTREAM_VERSION_INPUT: ${{ inputs.upstream_version }}
        run: |
          set -euo pipefail
          version="${UPSTREAM_VERSION_INPUT:-$(cat UPSTREAM_VERSION)}"
          bun build.ts "$version"
          fork_version=$(bun version.ts "$version")
          echo "PACKAGE_TARBALL=./dist/nyssance-dsh-code-runtime-worker-thread-$fork_version.tgz" >> "$GITHUB_ENV"
      - name: Verify actual packed workers
        run: |
          set -euo pipefail
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          # Install as a consumer: upstream lists its peers as devDependencies too.
          npm install --prefix "$smoke" --ignore-scripts --omit=dev --no-audit --no-fund "$PWD/$PACKAGE_TARBALL"
          worker="$smoke/node_modules/@nyssance/dsh-code-runtime-worker-thread"
          node runtime-smoke.mjs "$worker" | tee "$smoke/node-runtime.log"
          grep -qx "SMOKE_COMPLETE runtime" "$smoke/node-runtime.log"
          bun runtime-smoke.mjs "$worker" | tee "$smoke/bun-runtime.log"
          grep -qx "SMOKE_COMPLETE runtime" "$smoke/bun-runtime.log"
          node lifecycle-smoke.mjs "$worker" | tee "$smoke/node-lifecycle.log"
          grep -qx "SMOKE_COMPLETE lifecycle" "$smoke/node-lifecycle.log"
          bun lifecycle-smoke.mjs "$worker" | tee "$smoke/bun-lifecycle.log"
          grep -qx "SMOKE_COMPLETE lifecycle" "$smoke/bun-lifecycle.log"
          node capabilities-smoke.mjs "$worker" | tee "$smoke/node-capabilities.log"
          grep -qx "SMOKE_COMPLETE capabilities" "$smoke/node-capabilities.log"
          bun capabilities-smoke.mjs "$worker" | tee "$smoke/bun-capabilities.log"
          grep -qx "SMOKE_COMPLETE capabilities" "$smoke/bun-capabilities.log"
      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          tgz="$PACKAGE_TARBALL"
          name=$(tar -xOzf "$tgz" package/package.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["name"])')
          version=$(tar -xOzf "$tgz" package/package.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          if npm view "$name@$version" version --json > "$RUNNER_TEMP/npm-version.json"; then
            echo "$name@$version is already on npm; bump UPSTREAM_VERSION instead" >&2
            exit 1
          fi
          # Only a registry E404 means absent. Authentication/network errors stop release.
          python3 - "$RUNNER_TEMP/npm-version.json" <<'PYCODE'
          import json, sys
          result = json.load(open(sys.argv[1]))
          if result.get("error", {}).get("code") != "E404":
              raise SystemExit("Cannot verify version absence; refusing to publish")
          PYCODE
          if [[ "$GITHUB_EVENT_NAME" == "release" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must be v$version" >&2
            exit 1
          fi
          # Revised fork versions are SemVer prereleases and explicitly opt in via next.
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "publishing $name@$version (dist-tag $tag)"
          echo "NPM_DIST_TAG=$tag" >> "$GITHUB_ENV"
      # npm trusted publishing (OIDC, configured on the package's npm settings page):
      # no token anywhere — id-token: write above is the whole credential. bun publish
      # cannot do OIDC; npm 11.5+ (bundled with Node 24) can.
      - run: npm publish "$PACKAGE_TARBALL" --provenance --access public --tag "$NPM_DIST_TAG"
